<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juice Shop-style Login</title>
  <style>
    :root { --bg:#f4f4f5; --card:#fff; --accent:#3b82f6; --err:#dc2626; --ok:#16a34a; --line:#d4d4d8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: #18181b;
    }
    .card {
      background: var(--card); width: min(380px, 92vw); padding: 32px;
      border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 20px; font-size: 22px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line);
      border-radius: 8px; font-size: 15px;
    }
    input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    button {
      width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(.95); }
    .message { min-height: 20px; margin: 14px 0 0; font-size: 14px; }
    .message.error { color: var(--err); }
    .message.ok { color: var(--ok); }
    .hint { margin-top: 18px; font-size: 12px; color: #71717a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Login</h1>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />

      <p id="message" class="message" role="alert"></p>
      <button type="submit">Log in</button>
    </form>
    <p class="hint">Demo account: admin@juice-shop.local / CorrectHorse9!</p>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('message');

    // Client-side validation: fast feedback, prevents empty/obviously-bad submits.
    function clientValidate(email, password) {
      if (!email.trim() || !password) return 'Please fill in both fields.';
      if (!email.includes('@')) return 'Email must contain "@".';
      if (password.length < 8) return 'Password must be at least 8 characters.';
      return null;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'message';

      const email = form.email.value;
      const password = form.password.value;

      const clientError = clientValidate(email, password);
      if (clientError) {
        msg.textContent = clientError;      // textContent, NOT innerHTML -> no XSS
        msg.classList.add('error');
        return;
      }

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        msg.textContent = data.message;     // server message rendered as plain text
        msg.classList.add(data.ok ? 'ok' : 'error');
      } catch (err) {
        msg.textContent = 'Could not reach the server.';
        msg.classList.add('error');
      }
    });
  </script>
</body>
</html>
